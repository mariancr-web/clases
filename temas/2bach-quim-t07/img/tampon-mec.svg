<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 236' width='640' height='236'><defs><marker id='fl' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#1E293B'/></marker><marker id='fla' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#E11D48'/></marker><marker id='flt' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#BE123C'/></marker><pattern id='rayas' width='7' height='7' patternUnits='userSpaceOnUse' patternTransform='rotate(45)'><rect width='7' height='7' fill='#FFF1F2'/><line x1='0' y1='0' x2='0' y2='7' stroke='#E11D48' stroke-width='1.2' stroke-opacity='.45'/></pattern></defs><rect x='200.0' y='18.0' width='240.0' height='54.0' rx='10' fill='#1E293B' stroke='none' stroke-width='0' /><text x='320.0' y='42.0' text-anchor='middle' font-family='Barlow, sans-serif' font-size='18.3' font-weight='700' fill='#fff' >CH₃COOH / CH₃COO⁻</text><text x='320.0' y='62.0' text-anchor='middle' font-family='Barlow, sans-serif' font-size='12.81' font-weight='600' fill='#E2E8F0' >ácido débil + su base conjugada</text><line x1='280.0' y1='76.0' x2='160.0' y2='112.0' stroke='#E11D48' stroke-width='2' marker-end='url(#fla)'/><rect x='20.0' y='116.0' width='280.0' height='30.0' rx='8' fill='#FFF1F2' stroke='none' stroke-width='0' /><text x='160.0' y='137.0' text-anchor='middle' font-family='Barlow, sans-serif' font-size='15.86' font-weight='700' fill='#BE123C' >se añade H₃O⁺</text><text x='160.0' y='172.0' text-anchor='middle' font-family='Barlow, sans-serif' font-size='14.64' font-weight='700' fill='#1E293B' >CH₃COO⁻ + H₃O⁺ → CH₃COOH + H₂O</text><text x='160.0' y='192.0' text-anchor='middle' font-family='Barlow, sans-serif' font-size='13.42' font-weight='600' fill='#475569' >la base conjugada lo retira</text><line x1='360.0' y1='76.0' x2='480.0' y2='112.0' stroke='#1E293B' stroke-width='2' marker-end='url(#fl)'/><rect x='340.0' y='116.0' width='280.0' height='30.0' rx='8' fill='#F1F5F9' stroke='none' stroke-width='0' /><text x='480.0' y='137.0' text-anchor='middle' font-family='Barlow, sans-serif' font-size='15.86' font-weight='700' fill='#1E293B' >se añade OH⁻</text><text x='480.0' y='172.0' text-anchor='middle' font-family='Barlow, sans-serif' font-size='14.64' font-weight='700' fill='#1E293B' >CH₃COOH + OH⁻ → CH₃COO⁻ + H₂O</text><text x='480.0' y='192.0' text-anchor='middle' font-family='Barlow, sans-serif' font-size='13.42' font-weight='600' fill='#475569' >el ácido débil lo retira</text><text x='320.0' y='222.0' text-anchor='middle' font-family='Barlow, sans-serif' font-size='14.03' font-weight='700' fill='#BE123C' >El pH apenas cambia: las dos especies «absorben» el ácido o la base añadidos.</text></svg>